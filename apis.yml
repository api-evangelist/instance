name: Instance
description: >-
  Instance (Instance Labs) is a Y Combinator-backed (Summer 2026) company building a verification
  layer for robot learning. Their platform ingests raw robot rollouts and episode footage from any
  robot or camera angle and automatically judges whether a task was completed successfully, returning
  a verdict with supporting evidence and a detailed subtask breakdown. The company positions itself as
  the ground-truth / success-detection layer that lets robotics teams trust their training data and
  train policies faster, and reports its verifier reaching higher accuracy than frontier vision-language
  models at a fraction of the latency across 10,000+ human-labeled episodes on 7 robot platforms.
  Founded by MIT computer scientists with backgrounds at SpaceX, AWS, and NASA JPL. Today the product
  is exposed as a hosted demo (submit videos or capture a live rollout for verification); there is no
  publicly documented developer API, SDK, or OpenAPI at this time.
