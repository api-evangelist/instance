openapi: 3.1.0
info:
  title: Robot rollout verifier Archive Live State API
  version: 0.1.0
tags:
- name: Live State
paths:
  /api/live_state:
    get:
      summary: Live State
      description: '1s poll from the wall''s live tile: newest frame + tick state +

        captions + (once confirmed) the verdict.'
      operationId: live_state_api_live_state_get
      parameters:
      - name: session
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Live State
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
