openapi: 3.1.0
info:
  title: Robot rollout verifier Archive H1 API
  version: 0.1.0
tags:
- name: H1
paths:
  /api/h1:
    post:
      summary: H1 Endpoint
      description: 'Synchronous single-rollout batch (kept for scripts/curl; the UI uses

        /api/verify/start so a big batch can''t outlive the Cloudflare timeout).'
      operationId: h1_endpoint_api_h1_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_h1_endpoint_api_h1_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - H1
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Body_h1_endpoint_api_h1_post:
      properties:
        task:
          type: string
          title: Task
        files:
          anyOf:
          - items:
              type: string
              contentMediaType: application/octet-stream
            type: array
          - type: 'null'
          title: Files
        frames:
          type: integer
          title: Frames
          default: 8
        tokens:
          type: string
          title: Tokens
      type: object
      required:
      - task
      title: Body_h1_endpoint_api_h1_post
