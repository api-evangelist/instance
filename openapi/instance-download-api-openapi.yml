openapi: 3.1.0
info:
  title: Robot rollout verifier Archive Download API
  version: 0.1.0
tags:
- name: Download
paths:
  /api/download:
    get:
      summary: Download
      description: 'Zip the ORIGINAL clips for the given clip_ids (the caller passes the ones

        h1 verified successful). Returns successful_rollouts.zip.'
      operationId: download_api_download_get
      parameters:
      - name: ids
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Download
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
