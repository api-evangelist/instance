openapi: 3.1.0
info:
  title: Robot rollout verifier Archive Subtasks API
  version: 0.1.0
tags:
- name: Subtasks
paths:
  /api/subtasks:
    post:
      summary: Subtasks Endpoint
      description: 'Grounded subtask breakdown for one clip (Opus-only, no local model).


        Re-samples the RETAINED source clip at higher density than the verdict

        (grounding needs to localize *within* the clip, not just judge the end),

        then asks Opus to decompose + ground each step. Returns the timeline plus

        the frames it saw, so the UI can align evidence thumbnails to the strip.'
      operationId: subtasks_endpoint_api_subtasks_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubtaskReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Subtasks
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SubtaskReq:
      properties:
        task:
          type: string
          title: Task
        clip_id:
          type: string
          title: Clip Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        frames:
          type: integer
          title: Frames
          default: 16
        mode:
          type: string
          title: Mode
          default: explain
      type: object
      required:
      - task
      - clip_id
      title: SubtaskReq
