openapi: 3.1.0
info:
  title: Robot rollout verifier Archive API
  version: 0.1.0
tags:
- name: Archive
paths:
  /api/archive/{fname}:
    get:
      summary: Archive Clip
      description: 'Stream one archived upload for the usage viewer (same secret as

        /api/usage — archived clips are user data, never public).'
      operationId: archive_clip_api_archive__fname__get
      parameters:
      - name: fname
        in: path
        required: true
        schema:
          type: string
          title: Fname
      - name: token
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Archive
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
